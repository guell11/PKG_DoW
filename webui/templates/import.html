<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Importar jogos · PKG_DoW</title>
    <style>
      :root {
        --bg: #02060d;
        --surface: #111821dd;
        --surface2: #171d26e8;
        --line: #ffffff26;
        --text: #f7f8fc;
        --muted: #b7bbc5;
        --focus: #fff;
        --blue: #9bc8ff;
        --accent: #8f52ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 65% 0, #172f55, #02060d 58%);
        color: var(--text);
        font:
          15px Arial,
          sans-serif;
      }
      header {
        height: 92px;
        display: flex;
        align-items: center;
        padding: 20px 5%;
        border-bottom: 1px solid var(--line);
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #a9d8ff,
          #223c63 45%,
          #111
        );
        border: 2px solid var(--blue);
      }
      nav {
        display: flex;
        gap: 28px;
        margin: auto;
      }
      a {
        color: var(--muted);
        text-decoration: none;
        font-size: 16px;
      }
      a.active,
      a:hover {
        color: #fff;
        border-bottom: 3px solid var(--blue);
        padding-bottom: 9px;
      }
      time {
        min-width: 55px;
      }
      main {
        width: min(1180px, 90vw);
        margin: auto;
        padding: 42px 0;
      }
      .crumb {
        color: var(--blue);
        font-size: 12px;
        letter-spacing: 1px;
      }
      h1 {
        font-size: 39px;
        margin: 10px 0;
      }
      p {
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 0.82fr 1.18fr;
        gap: 20px;
        margin-top: 28px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 22px;
      }
      .panel h2 {
        margin: 0 0 17px;
      }
      .actions {
        display: grid;
        gap: 11px;
      }
      .action {
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 17px;
        text-align: left;
        color: var(--text);
        cursor: pointer;
      }
      .action:hover,
      .action.active {
        border-color: var(--blue);
        background: #20304a;
      }
      .action b,
      .action span {
        display: block;
      }
      .action span {
        color: var(--muted);
        font-size: 13px;
        margin-top: 5px;
      }
      .path {
        display: flex;
        gap: 8px;
      }
      .path input {
        flex: 1;
        min-width: 0;
        background: #050a12;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: #fff;
        padding: 11px;
      }
      .btn {
        background: #f7f8fc;
        color: #09101a;
        border: 0;
        border-radius: 21px;
        padding: 10px 18px;
        font-weight: bold;
        cursor: pointer;
      }
      .btn.dim {
        background: #ffffff13;
        color: white;
        border: 1px solid var(--line);
      }
      .files {
        height: 295px;
        margin-top: 13px;
        overflow: auto;
        border: 1px solid #ffffff16;
        border-radius: 11px;
        padding: 5px;
      }
      .file {
        width: 100%;
        display: grid;
        grid-template-columns: 32px 1fr auto;
        align-items: center;
        text-align: left;
        padding: 11px 9px;
        border: 0;
        border-bottom: 1px solid #ffffff12;
        background: transparent;
        color: white;
        cursor: pointer;
      }
      .file:hover {
        background: #ffffff0b;
      }
      .file small {
        color: var(--muted);
      }
      .browser-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
      }
      .status {
        margin-top: 20px;
      }
      .bar {
        height: 10px;
        background: #080d14;
        border-radius: 10px;
        overflow: hidden;
        margin: 14px 0 9px;
      }
      .fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), var(--blue));
        transition: width 0.3s;
      }
      .msg {
        color: var(--muted);
        min-height: 20px;
      }
      .error {
        color: #ff9caf;
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
        nav {
          gap: 10px;
        }
        main {
          width: 94vw;
        }
      }
      @media (min-width: 761px) and (max-height: 800px) {
        header { height: 76px; padding-block: 12px; }
        main { padding: 22px 0; }
        h1 { font-size: 34px; margin: 6px 0; }
        .grid { margin-top: 18px; }
        .panel { padding: 17px; }
        .panel h2 { margin-bottom: 12px; }
        .actions { gap: 8px; }
        .action { padding: 11px 14px; }
        .files { height: 254px; }
        .status { margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="profile">
        <div class="avatar"></div>
        <strong>Player1</strong>
      </div>
      <nav>
        <a href="/index.html">Início</a><a href="/library.html">Biblioteca</a
        ><a class="active" href="/import.html">Importar</a
        ><a href="/settings.html">Configurações</a
        ><a href="/system.html">Sistema</a>
      </nav>
      <time id="clock">--:--</time>
    </header>
    <main>
      <div class="crumb">BIBLIOTECA · GERENCIAMENTO</div>
      <h1>Importar jogos</h1>
      <p>PKG, pasta extraída e escaneamento. Sem abrir interface externa.</p>
      <div class="grid">
        <section class="panel">
          <h2>Escolha uma ação</h2>
          <div class="actions">
            <button class="action" data-mode="pkg">
              <b>⬡ Importar PKG</b
              ><span>Extrair e instalar dentro do PKG_DoW</span></button
            ><button class="action" data-mode="folder">
              <b>▣ Importar pasta do jogo</b
              ><span>Adicionar jogo já extraído</span></button
            ><button class="action" data-mode="scan">
              <b>⌕ Escanear pasta</b
              ><span>Localizar jogos CUSA na raiz</span></button
            ><button class="action" id="sync">
              <b>↻ Sincronizar biblioteca</b
              ><span>Atualizar jogos instalados</span>
            </button>
          </div>
          <div class="status">
            <b id="jobtitle">Pronto</b>
            <div class="bar"><div class="fill" id="fill"></div></div>
            <div class="msg" id="msg">Escolha uma ação.</div>
          </div>
        </section>
        <section class="panel">
          <h2>Navegador interno</h2>
          <div class="path">
            <button id="back" class="btn dim">‹</button
            ><input id="path" placeholder="Caminho" /><button
              id="go"
              class="btn"
            >
              Ir
            </button>
          </div>
          <div class="files" id="files">
            <div class="msg">Escolha ação para listar discos.</div>
          </div>
          <div class="browser-actions">
            <span class="msg" id="selectionHelp">Nenhuma seleção</span
            ><button id="useFolder" class="btn" hidden>Usar esta pasta</button>
          </div>
        </section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let mode = "",
        current = "",
        parent = "";
      function tick() {
        $("clock").textContent = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      tick();
      setInterval(tick, 1000);
      function safe(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      async function request(url, options) {
        const r = await fetch(url, options);
        let d = await r.json();
        if (!r.ok || (d.ok === false && !d.cancelled))
          throw new Error(d.error || `HTTP ${r.status}`);
        return d;
      }
      async function browse(path = current) {
        try {
          const d = await request(
            "/api/browse?path=" + encodeURIComponent(path || ""),
          );
          current = d.path || "";
          parent = d.parent || "";
          $("path").value = current;
          $("back").disabled = !parent;
          $("files").innerHTML =
            (d.entries || [])
              .map(
                (e, i) =>
                  `<button class="file" data-i="${i}"><span>${e.type === "file" ? "▤" : e.type === "drive" ? "◉" : "▱"}</span><span>${safe(e.name)}</span><small>${e.type === "file" ? formatSize(e.size) : e.type === "drive" ? "Disco" : "Pasta"}</small></button>`,
              )
              .join("") || '<div class="msg">Pasta vazia.</div>';
          $("files")
            .querySelectorAll(".file")
            .forEach(
              (b) => (b.onclick = () => pick(d.entries[Number(b.dataset.i)])),
            );
        } catch (e) {
          show(e.message, true);
        }
      }
      function formatSize(n) {
        if (!n) return "";
        const u = ["B", "KB", "MB", "GB"];
        let i = 0;
        while (n > 1024 && i < 3) {
          n /= 1024;
          i++;
        }
        return n.toFixed(i ? 1 : 0) + " " + u[i];
      }
      function choose(next) {
        mode = next;
        document
          .querySelectorAll(".action[data-mode]")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.mode === mode),
          );
        $("jobtitle").textContent =
          mode === "pkg"
            ? "Importar PKG"
            : mode === "folder"
              ? "Importar pasta"
              : "Escanear pasta";
        $("selectionHelp").textContent =
          mode === "pkg" ? "Abra um arquivo .pkg" : "Entre na pasta desejada";
        $("useFolder").hidden = mode === "pkg";
        $("useFolder").textContent =
          mode === "scan" ? "Escanear esta pasta" : "Importar esta pasta";
        browse(current);
      }
      function pick(entry) {
        if (entry.type === "folder" || entry.type === "drive") {
          browse(entry.path);
          return;
        }
        if (mode !== "pkg") {
          show("Escolha uma pasta.", true);
          return;
        }
        if (!entry.path.toLowerCase().endsWith(".pkg")) {
          show("Selecione arquivo .pkg.", true);
          return;
        }
        installPkg(entry.path);
      }
      async function installPkg(path) {
        try {
          show("Lendo pacote...");
          const imported = await post("/api/import-path", { path });
          const job = await post("/api/install-pkg", { id: imported.game.id });
          $("jobtitle").textContent = job.title || "Instalando PKG";
          history.replaceState(
            null,
            "",
            "/import.html?job=" + encodeURIComponent(job.job),
          );
          poll(job.job);
        } catch (e) {
          show(e.message, true);
        }
      }
      async function useFolder() {
        if (!current) {
          show("Abra uma pasta.", true);
          return;
        }
        try {
          if (mode === "scan") {
            const d = await post("/api/scan-cusa", { path: current });
            show(`${d.count} jogo(s) encontrado(s).`);
            return;
          }
          const d = await post("/api/import-path", { path: current });
          show(`${d.game.title} adicionado.`);
          setTimeout(() => (location.href = "/library.html"), 700);
        } catch (e) {
          show(e.message, true);
        }
      }
      async function sync() {
        try {
          const d = await post("/api/sync-ps4", {});
          show(`${d.count} jogo(s) sincronizado(s).`);
        } catch (e) {
          show(e.message, true);
        }
      }
      async function post(url, body) {
        return request(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }
      function show(text, error = false) {
        $("msg").textContent = text;
        $("msg").classList.toggle("error", error);
      }
      async function poll(job) {
        show("Extraindo em segundo plano...");
        const timer = setInterval(async () => {
          try {
            const d = await request(
              "/api/install-status?job=" + encodeURIComponent(job),
            );
            const p = Number(d.progress || 0);
            $("fill").style.width = p + "%";
            show(
              d.state === "running"
                ? `${p}% · extraindo arquivos`
                : d.state === "done"
                  ? "Instalação concluída."
                  : d.error || "Falha na instalação.",
              d.state === "error",
            );
            if (d.state === "done" || d.state === "error") {
              clearInterval(timer);
              if (d.state === "done")
                setTimeout(() => (location.href = "/library.html"), 900);
            }
          } catch (e) {
            clearInterval(timer);
            show(e.message, true);
          }
        }, 500);
      }
      document
        .querySelectorAll(".action[data-mode]")
        .forEach((b) => (b.onclick = () => choose(b.dataset.mode)));
      $("sync").onclick = sync;
      $("go").onclick = () => browse($("path").value);
      $("back").onclick = () => browse(parent);
      $("useFolder").onclick = useFolder;
      $("path").onkeydown = (e) => {
        if (e.key === "Enter") browse(e.target.value);
      };
      const initialJob = new URLSearchParams(location.search).get("job");
      if (initialJob) poll(initialJob);
      else browse("");
    </script>
  </body>
</html>
