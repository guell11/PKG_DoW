<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sistema</title>
    <style>
      :root {
        --bg: #02060d;
        --surface: #111821dd;
        --surface2: #171d26e8;
        --line: #ffffff26;
        --text: #f7f8fc;
        --muted: #b7bbc5;
        --focus: #fff;
        --blue: #9bc8ff;
        --accent: #8f52ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px Arial;
        overflow: hidden;
      }
      body:before {
        content: "";
        position: fixed;
        inset: -10%;
        background:
          radial-gradient(circle at 70% 25%, #183d6d, transparent 42%),
          linear-gradient(130deg, #02060d, #071323);
        filter: blur(25px);
        z-index: -1;
      }
      .top {
        height: 86px;
        display: flex;
        align-items: center;
        padding: 20px 42px;
        gap: 35px;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
      }
      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #142b50, #b9dcff);
        font-size: 25px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 3px;
      }
      .nav {
        display: flex;
        gap: 29px;
        margin: auto;
        font-size: 24px;
      }
      .nav a {
        color: #d8dce6;
        text-decoration: none;
        opacity: 0.75;
        padding: 9px;
      }
      .nav a.active {
        opacity: 1;
        border-bottom: 3px solid var(--blue);
      }
      .clock {
        font-size: 17px;
      }
      .content {
        height: calc(100vh - 86px);
        padding: 24px 8.5vw;
        overflow: auto;
      }
      .eyebrow {
        color: var(--blue);
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin: 8px 0 22px;
      }
      .heading h1 {
        font-size: 37px;
        margin: 0;
      }
      .status {
        color: #77e4ad;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 1050px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 19px;
        backdrop-filter: blur(15px);
        min-height: 155px;
      }
      .panel.wide {
        grid-column: span 2;
      }
      .panel h2 {
        margin: 0 0 15px;
        font-size: 17px;
        font-weight: 600;
      }
      .metric {
        display: flex;
        justify-content: space-between;
        margin: 12px 0;
        color: var(--muted);
      }
      .metric b {
        color: var(--text);
      }
      .bar {
        height: 7px;
        border-radius: 8px;
        background: #ffffff1a;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--accent));
        border-radius: 8px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        padding: 8px 11px;
        border-radius: 9px;
        color: var(--muted);
        background: #ffffff08;
      }
      .log {
        font: 12px Consolas;
        color: #b9d8f8;
        line-height: 1.7;
      }
      .refresh {
        border: 1px solid var(--line);
        background: #ffffff12;
        color: #fff;
        padding: 9px 15px;
        border-radius: 20px;
        cursor: pointer;
      }
      .refresh:focus,
      .chip:focus {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 850px) {
        .top {
          padding: 16px 20px;
        }
        .nav {
          gap: 6px;
        }
        .content {
          padding: 20px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .panel.wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="profile">
        <div class="avatar">◉</div>
        <div>
          <div>Player1 ✚</div>
          <div class="sub">🏆 21.337</div>
        </div>
      </div>
      <nav class="nav">
        <a href="/index.html">▦</a><a href="/library.html">🎮</a
        ><a href="/import.html">＋</a><a href="/settings.html">⚙</a
        ><a class="active" href="/system.html">⌕</a>
      </nav>
      <div id="clock"></div>
    </header>
    <main class="content">
      <div class="eyebrow">PKG_DoW</div>
      <div class="heading">
        <h1>Sistema</h1>
        <button class="refresh" onclick="load()">↻ Atualizar</button>
      </div>
      <section class="grid">
        <article class="panel">
          <h2>Estado do sistema <span class="status">● Online</span></h2>
          <div class="metric"><span>Versão</span><b id="version">—</b></div>
          <div class="metric"><span>Uptime</span><b id="uptime">—</b></div>
          <div class="metric"><span>API</span><b id="api">Conectando…</b></div>
        </article>
        <article class="panel">
          <h2>Recursos</h2>
          <div class="metric"><span>CPU</span><b id="cpu">—</b></div>
          <div class="bar"><i id="cpub" style="width: 0%"></i></div>
          <div class="metric"><span>RAM</span><b id="ram">—</b></div>
          <div class="bar"><i id="ramb" style="width: 0%"></i></div>
        </article>
        <article class="panel">
          <h2>Armazenamento</h2>
          <div class="metric"><span>Usado</span><b id="disk">—</b></div>
          <div class="bar"><i id="diskb" style="width: 0%"></i></div>
          <p class="muted" id="diskfree">Espaço livre: —</p>
        </article>
        <article class="panel wide">
          <h2>Engines disponíveis</h2>
          <div class="chips" id="engines">
            <span class="chip">Carregando…</span>
          </div>
        </article>
        <article class="panel wide">
          <h2>Diagnósticos recentes</h2>
          <div class="log" id="logs">Aguardando diagnóstico…</div>
        </article>
      </section>
    </main>
    <script>
      const id = (x) => document.getElementById(x),
        num = (x) => (x == null ? "—" : Number(x).toFixed(1));
      const size = (x) => {
        let n = Number(x || 0), units = ["B", "KB", "MB", "GB", "TB"], i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return `${n.toFixed(i > 2 ? 1 : 0)} ${units[i]}`;
      };
      function tick() {
        id("clock").textContent = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      setInterval(tick, 1000);
      tick();
      async function get(u) {
        try {
          let r = await fetch(u);
          return r.ok ? await r.json() : null;
        } catch (e) {
          return null;
        }
      }
      async function load() {
        let [s, d, v, l] = await Promise.all(
            ["/api/status", "/api/diagnostics", "/api/vulkan", "/api/logs"].map(
              get,
            ),
          ),
          ram = Number(s?.ram_total)
            ? (Number(s.ram_used) / Number(s.ram_total)) * 100
            : 0,
          disk = Number(s?.disk_total)
            ? (Number(s.disk_used) / Number(s.disk_total)) * 100
            : 0;
        id("version").textContent = s?.version || "1.0.0";
        id("uptime").textContent = s?.uptime || "—";
        id("api").textContent = "Conectada";
        id("cpu").textContent = (s?.cpu_threads ?? "—") + " threads";
        id("ram").textContent = num(ram) + "%";
        id("disk").textContent = num(disk) + "%";
        id("cpub").style.width =
          Math.min(Number(s?.cpu_threads || 0) * 10, 100) + "%";
        id("ramb").style.width = ram + "%";
        id("diskb").style.width = disk + "%";
        id("diskfree").textContent =
          "Espaço livre: " +
          size(Number(s?.disk_total || 0) - Number(s?.disk_used || 0));
        let es = s?.engines || {};
        let labels = { kyty: "Core PS5", sharpemu: "Core PS5 alternativo", shadps4: "Core PS4", pkg_installer: "Extrator PKG interno" };
        id("engines").innerHTML =
          Object.entries(es)
            .filter((x) => x[1])
            .map((x) => '<span class="chip">' + (labels[x[0]] || x[0]) + ": pronto</span>")
            .join("") +
          '<span class="chip">Vulkan: ' +
          (v?.available ? "Disponível" : "Indisponível") +
          "</span>";
        let cleanDetail = (x) => {
          if (["Core PS5", "Core PS4", "Extrator PKG interno"].includes(x.name)) return "Pronto";
          if (x.name === "RAM >= 16 GB" || x.name === "Disco livre >= 10 GB") return size(x.detail);
          return x.detail || "";
        };
        let lines = (Array.isArray(l) ? l.map((x) => x.name || String(x)) : []).concat(
          (d?.checks || []).map((x) =>
            typeof x === "string"
              ? x
              : (x.ok ? "✓ " : "! ") + (x.name || x.id) + " · " + cleanDetail(x),
          ),
        );
        id("logs").innerHTML = (lines.length ? lines : ["Sistema pronto."])
          .slice(-8)
          .map((x) => "› " + x)
          .join("<br>");
      }
      load();
    </script>
  </body>
</html>
